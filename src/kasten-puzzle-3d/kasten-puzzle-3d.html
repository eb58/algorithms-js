<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0}</style>
<title>Kasten-Puzzle 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Ctext%20y%3D'.9em'%20font-size%3D'90'%3E%F0%9F%A7%A9%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="./kasten-puzzle-3d.css">

</head>
<body>
<div class="app">
  <aside class="panel" aria-label="Steuerung">
    <div class="brand">
      <h1>Kasten-Puzzle 3D</h1>
      <p>Ziehen zum Drehen, Rad oder zwei Finger zum Zoomen.</p>
    </div>

    <div class="tabs" role="tablist" aria-label="Modus">
      <button class="tab" id="tabParts" role="tab" type="button" aria-selected="true">Teile ansehen</button>
      <button class="tab" id="tabAsm" role="tab" type="button" aria-selected="false">Zusammenbau</button>
    </div>

    <div class="mode" id="modeParts">
    <section>
      <h3 class="label">Teile</h3>
      <div class="parts" id="partList"></div>
    </section>

    <section class="info" id="info" aria-live="polite"></section>

    <section>
      <h3 class="label">Teil drehen</h3>
      <div class="btn-row">
        <button class="btn" id="rotX" type="button">90° um X</button>
        <button class="btn" id="rotY" type="button">90° um Hochachse</button>
        <button class="btn" id="rotZ" type="button">90° um Z</button>
        <button class="btn" id="rotReset" type="button">Zurücksetzen</button>
      </div>
      <p class="hint" id="rotHint">Wähl ein einzelnes Teil, um es zu drehen.</p>
    </section>
    </div>

    <div class="mode" id="modeAsm" hidden>
      <div class="step-card" aria-live="polite">
        <span class="progress" id="stepProgress">Schritt 1 von 6</span>
        <h2 id="stepTitle"></h2>
        <p id="stepText"></p>
      </div>
      <div class="player">
        <button class="btn" id="stepPrev" type="button">Zurück</button>
        <button class="btn primary" id="stepNext" type="button">Weiter</button>
        <button class="btn" id="stepPlay" type="button">Abspielen</button>
        <button class="btn" id="stepReset" type="button">Von vorn</button>
      </div>
      <section>
        <h3 class="label">Schritte</h3>
        <ol class="steps" id="stepList"></ol>
      </section>
    </div>

    <section>
      <h3 class="label">Darstellung</h3>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="tXray"> Kasten durchsichtig (Innenleben)</label>
        <label class="toggle"><input type="checkbox" id="tEdges" checked> Kanten</label>
        <label class="toggle"><input type="checkbox" id="tGrid" checked> Raster (1 u)</label>
        <label class="toggle"><input type="checkbox" id="tSpin"> Automatisch drehen</label>
      </div>
    </section>
  </aside>

  <main class="viewport">
    <canvas id="stage" aria-label="3D-Ansicht der Puzzleteile"></canvas>
    <div class="overlay-top">
    <div class="badge" id="badge">Alle Teile</div>
    <div class="views" role="group" aria-label="Ansicht">
      <button class="btn" data-view="iso" type="button">Iso</button>
      <button class="btn" data-view="front" type="button">Vorne</button>
      <button class="btn" data-view="back" type="button">Hinten</button>
      <button class="btn" data-view="left" type="button">Links</button>
      <button class="btn" data-view="right" type="button">Rechts</button>
      <button class="btn" data-view="top" type="button">Oben</button>
      <button class="btn" data-view="bottom" type="button">Unten</button>
    </div>
    </div>
    <div class="help">Ziehen: drehen · Rechtsklick oder Shift: verschieben · Rad: zoomen · Klick auf Teil: einzeln</div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="./core.js"></script>
<script src="./geometry.js"></script>
<script src="./parts.js"></script>
<script src="./scene.js"></script>
<script src="./camera.js"></script>
<script src="./ui.js"></script>
<script src="./assembly.js"></script>
<script src="./main.js"></script>

</body>
</html>
