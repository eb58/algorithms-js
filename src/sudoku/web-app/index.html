<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sudoku aus einem Zeitungsfoto erkennen und lösen." />
    <meta name="theme-color" content="#f3f0e8" />
    <title>Sudoku Lens</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="../sudokuUtils.js"></script>
    <script defer src="../sudoku5.js"></script>
    <script defer src="sudoku.js"></script>
    <script defer src="digit-templates.js"></script>
    <script defer src="image-ops.js"></script>
    <script defer src="digits.js"></script>
    <script defer src="scanner.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#">SUDOKU <span>LENS</span></a>
      <div class="heading-actions">
        <span id="grid-status" class="status neutral" aria-live="polite" hidden></span>
      </div>
    </header>

    <main>
      <h1 class="sr-only">Sudoku Lens: Sudoku aus einem Foto erkennen und lösen</h1>
      <section class="workspace">
        <div class="photo-panel">
          <div id="drop-zone" class="drop-zone">
            <input id="camera-input" type="file" accept="image/*" capture="environment" hidden />
            <input id="file-input" type="file" accept="image/*" hidden />
            <span class="camera-icon" aria-hidden="true">⌁</span>
            <div class="photo-input-actions">
              <button id="camera-button" class="primary-button" type="button">Foto aufnehmen</button>
              <button id="file-button" class="secondary-button" type="button">Bild auswählen</button>
            </div>
            <small>Möglichst gerade und ohne Schatten · bleibt auf diesem Gerät</small>
          </div>

          <div id="crop-stage" class="crop-stage" hidden>
            <div id="photo-frame" class="photo-frame">
              <canvas id="photo-canvas"></canvas>
              <svg id="selection" class="selection" preserveAspectRatio="none" aria-label="Erkannter Sudoku-Ausschnitt">
                <g class="oriented">
                  <path class="shade"></path>
                  <path class="guides"></path>
                  <polygon class="frame"></polygon>
                  <g class="photo-digits"></g>
                </g>
              </svg>
            </div>
          </div>
          <button id="reset-button" class="primary-button next-photo-button" type="button" hidden>
            Nächstes Foto <span aria-hidden="true">↻</span>
          </button>
        </div>

        <!-- nur sichtbar, wenn die erkannten Zahlen geprüft werden müssen -->
        <article id="grid-panel" class="grid-panel" aria-label="Erkannte Zahlen prüfen" hidden>
          <div id="sudoku-grid" class="sudoku-grid" aria-label="Sudoku-Eingabefeld"></div>
          <div class="legend">
            <span><i class="dot recognized"></i> erkannt</span><span><i class="dot uncertain"></i> unsicher</span
            ><span><i class="dot solved"></i> ergänzt</span>
          </div>
          <div class="actions grid-actions">
            <button id="clear-button" class="secondary-button" type="button">Leeren</button>
            <button id="solve-button" class="primary-button" type="button">Sudoku lösen <span>→</span></button>
          </div>
          <section id="solution-alternatives" class="solution-alternatives" aria-live="polite" hidden>
            <h3>Zwei mögliche Lösungen</h3>
            <div id="solution-list" class="solution-list"></div>
          </section>
        </article>
      </section>
    </main>
  </body>
</html>
